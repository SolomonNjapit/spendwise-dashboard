<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SpendWise Dashboard</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Login screen -->
  <div id="login-screen" class="login-screen">
    <form id="login-form" class="login-form">
      <div class="sidebar-logo" style="color: var(--color-brand); margin-bottom: 8px;">SpendWise</div>
      <p style="color: var(--color-text-secondary); margin: 0 0 20px;">Log in to continue</p>

      <label for="username">Username</label>
      <input type="text" id="username" name="username" required autocomplete="username">

      <label for="password">Password</label>
      <input type="password" id="password" name="password" required autocomplete="current-password">

      <button type="submit">Log In</button>
      <p id="login-error" class="login-error"></p>
    </form>
  </div>

<div class="dashboard" id="dashboard" style="display: none;"></div>
    <!-- Sidebar -->
    <aside class="sidebar">
      <div class="sidebar-logo">SpendWise</div>
      <nav class="sidebar-nav">
        <a href="#" class="nav-item active">Dashboard</a>
        <a href="#" class="nav-item">Transactions</a>
        <a href="#" class="nav-item">Budgets</a>
        <a href="#" class="nav-item">Reports</a>
        <a href="#" class="nav-item">Settings</a>
      </nav>
    </aside>

    <!-- Header -->
    <header class="header">
      <h1 class="header-title">Overview</h1>
      <div class="header-actions">
        <span class="header-user">Solomon Njapit</span>
        <div class="header-avatar">SN</div>
        <button id="logout-btn" type="button">Log Out</button>
      </div>
    </header>

    <!-- Main content: category cards -->
    <main class="main-content">
            <form id="add-expense-form" class="add-expense-form">
        <input type="number" id="new-amount" step="0.01" placeholder="Amount" required>
        <input type="text" id="new-description" placeholder="Description" required>
        <input type="text" id="new-category" placeholder="Category" required>
        <button type="submit">Add Expense</button>
      </form>
            <div class="card-grid" id="expense-list">
        <p id="expense-empty" style="display:none; color: var(--color-text-secondary);">No expenses yet.</p>


      </div>
    </main>

  </div>
  <script src="script.js"></script>
</body>
</html>
